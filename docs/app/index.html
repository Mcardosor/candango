<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Candango</title>
  <meta name="description" content="Ônibus do DF em tempo real: mapa ao vivo, linhas até o seu destino e previsão de chegada." />
  <meta name="theme-color" content="#0B8A5F" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Candango" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="app.css" />
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="top"></div>
  <button id="fab" class="fab" data-act="me" hidden title="Centralizar na minha localização">
    <svg class="ic" viewBox="0 0 24 24" role="img" aria-label="Centralizar na minha localização"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
  </button>
  <section id="panel" aria-live="polite">
    <div class="grip-area" role="button" tabindex="0" aria-label="Arrastar para aumentar ou diminuir o painel"><div class="grip"></div></div>
    <div class="panel-body"></div>
  </section>
  <div id="search" hidden>
    <div class="search-bar">
      <button class="icon-btn" data-act="close-search" aria-label="Voltar">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" />
    </div>
    <div id="search-list"></div>
  </div>
  <noscript>O Candango precisa de JavaScript para funcionar.</noscript>
</body>
</html>
