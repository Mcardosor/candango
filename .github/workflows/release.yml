name: Release

# Publica uma versão ao criar uma tag vX.Y.Z:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Confere se a tag bate com o versionName
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com versionName $VERSION_NAME em app/build.gradle.kts"
            exit 1
          fi

      - name: Testes
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Recupera a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.CANDANGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret CANDANGO_KEYSTORE_BASE64 não configurado"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/candango-release.jks"

      - name: Compila e assina o APK
        env:
          CANDANGO_KEYSTORE: ${{ runner.temp }}/candango-release.jks
          CANDANGO_KEYSTORE_PASSWORD: ${{ secrets.CANDANGO_KEYSTORE_PASSWORD }}
          CANDANGO_KEY_ALIAS: candango
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk candango.apk
          cp candango.apk "candango-$GITHUB_REF_NAME.apk"
          rm -f "$RUNNER_TEMP/candango-release.jks"

      # O código fica num repositório privado; o APK é publicado no repositório público
      # Mcardosor/candango, para o link de download continuar aberto e o mesmo de sempre.
      - name: Publica no repositório público de downloads
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PUBLIC_REPO_TOKEN não configurado"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" candango.apk "candango-$GITHUB_REF_NAME.apk" \
            --repo Mcardosor/candango \
            --title "Candango $GITHUB_REF_NAME" \
            --notes "📥 **Para instalar:** baixe o \`candango.apk\` abaixo no seu Android e abra o arquivo. [Passo a passo](https://mcardosor.github.io/candango/#instalar)"
